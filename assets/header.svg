<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Richard Yuan — Full-Stack Developer, Sydney">
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="300" rx="20" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="#21262d" stroke-width="1.5"/>

  <!-- faint RY watermark -->
  <text x="1122" y="238" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="260" font-weight="700" fill="#161b22">RY</text>

  <!-- terminal prompt signature (top-left) -->
  <text x="80" y="62" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="15" letter-spacing="0.5"><tspan fill="#3fb950">richard@sydney</tspan><tspan fill="#5b6b7c">:~$</tspan></text>

  <!-- open-to-work marker (top-right) -->
  <circle cx="1050" cy="57" r="5" fill="#39d353"/>
  <text x="1064" y="62" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" fill="#7d8590" letter-spacing="2">OPEN TO WORK</text>

  <!-- name (large, minimal) -->
  <text x="78" y="150" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" font-size="66" fill="#f0f6fc" letter-spacing="0.5">Richard Yuan</text>

  <!-- accent line -->
  <rect x="80" y="170" width="96" height="4" rx="2" fill="url(#ac)"/>

  <!-- terminal-style subtitle + cursor -->
  <text x="80" y="212" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="22" fill="#8b949e"><tspan fill="#39d353">$</tspan> <tspan fill="#c9d1d9">whoami</tspan> <tspan fill="#5b6b7c">&#8594;</tspan> <tspan fill="#22d3ee">Full-Stack Developer</tspan></text>
  <rect x="516" y="196" width="12" height="22" fill="#39d353">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- code-comment sub-line -->
  <text x="80" y="246" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="16" fill="#6a9955">// Backend + AI · Master of IT @ UNSW · Sydney, AU 🌏</text>
</svg>
