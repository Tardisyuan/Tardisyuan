# 自生成 GitHub 统计卡(替代已挂掉的第三方 stats / trophy 服务)
# 用你自己仓库的 Action 生成静态 SVG,展示时零第三方依赖,永不裂图
name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # 每天刷新一次
  workflow_dispatch:        # 允许手动触发
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          template: classic
          # 只保留 header(commits/repos 等有数据的概览),去掉稀疏的 activity / community 区块
          base: header
          config_timezone: Australia/Sydney
          # 3D 贡献日历:直接可视化你今年的 1769 次提交,全是真数据
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # 语言分布(替代原来的 top-langs 卡)
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          # 成就徽章(替代原来的 trophy 奖杯墙)
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
